name = "relay"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licenses = ["Apache-2.0"]
description = "A feature-complete Model Context Protocol (MCP) implementation for Gleam: server and client, stdio and Streamable HTTP."
repository = { type = "github", user = "gleam-dream", repo = "relay" }

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 1.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
json_blueprint = { path = "../json_blueprint" }
sinal = { path = "../sinal" }
mist = "== 6.0.2"
gun = "== 2.6.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
